<section class="sk-block sk-perks1" data-bs-version="5.1" plugins="skyline">

    <mbr-parameters>
    <!-- Block parameters controls (Blue "Gear" panel) -->
        <input type="range" inline title="Top" name="paddingTop" min="0" max="9" step="1" value="6">
        <input type="range" inline title="Bottom" name="paddingBottom" min="0" max="9" step="1" value="6">
        <input type="checkbox" title="Show Title" name="showTitle" checked>
        <input type="checkbox" title="Show Buttons" name="showButtons" checked>
        <input type="color" title="Background Color" name="bgColor" value="#f2f7fa">
    <!-- End block parameters -->
    </mbr-parameters>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <h2 class="sk-title mbr-section-title mb-4 text-center mbr-fonts-style" mbr-theme-style="display-2" mbr-if="showTitle">Volunteer perks</h2>
                <ul class="sk-check mbr-text mbr-fonts-style" mbr-theme-style="display-5" mbr-list>
                    <li mbr-text>A reserved entry ticket</li>
                    <li mbr-text>Exclusive goodies</li>
                    <li mbr-text>Access to a staff lounge with snacks</li>
                    <li mbr-text>And a few more surprises</li>
                </ul>
                <div class="mbr-section-btn text-center mt-4" mbr-if="showButtons" mbr-buttons mbr-theme-style="display-4" data-toolbar="-mbrBtnMove,-mbrBtnAdd"><a class="sk-btn sk-btn-primary" href="#">Fill in the form to join the team</a></div>
            </div>
        </div>
    </div>

    <style>:root{--sk-navy: #080866; --sk-sky: #38bdf5; --sk-red: #e30512; --sk-ice: #b5cce8; --sk-ice-2: #dce7f5; --sk-ice-3: #f2f7fa; --sk-ink: #111; --sk-muted: #5c6370; --sk-white: #fff; --sk-r-sm: 10px; --sk-r-md: 14px; --sk-r-lg: 18px; --sk-r-pill: 64px; --sk-font-title: "Shrikhand", "Inter", sans-serif; --sk-font-body: "Inter", system-ui, sans-serif; --sk-shadow: 0 8px 24px rgba(8, 8, 102, .12);}.sk-block{font-family: var(--sk-font-body); color: var(--sk-ink); position: relative;}.sk-block .sk-title{font-family: var(--sk-font-title); color: var(--sk-navy); font-weight: 400; line-height: 1.05;}.sk-block :focus-visible{outline: 2px solid var(--sk-navy); outline-offset: 2px;}.sk-block .mbr-overlay{position: absolute; inset: 0; pointer-events: none;}.sk-block > .container,.sk-block > .container-fluid{position: relative; z-index: 1;}.sk-btn{display: inline-flex; max-width: 100%; text-align: center; justify-content: center; align-items: center; gap: .5rem; padding: .75rem 1.5rem; border-radius: var(--sk-r-pill); border: 2px solid transparent; font-weight: 500; text-decoration: none; transition: transform .15s, background-color .15s;}.sk-btn:hover{transform: translateY(-1px);}.sk-btn.sk-btn-primary{background: var(--sk-navy); color: var(--sk-white);}.sk-btn.sk-btn-primary:hover{background: #0d0da0; color: var(--sk-white);}.sk-check{list-style: none; padding: 0; margin: 1rem 0 1.5rem;}.sk-check li{padding-left: 1.75rem; position: relative; margin-bottom: .5rem;}.sk-check li::before{content: "✓"; position: absolute; left: 0; color: var(--sk-sky); font-weight: 700;}</style>
</section>
