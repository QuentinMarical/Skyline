<section class="sk-block sk-footer sk-footer1" group="Footers" data-bs-version="5.1" global once mbr-style="{'background-color': bgColor, 'padding-top': paddingTop * 15 + 'px', 'padding-bottom': paddingBottom * 15 + 'px'}">

    <mbr-parameters>
    <!-- Block parameters controls (Blue "Gear" panel) -->
        <input type="range" inline title="Top" name="paddingTop" min="0" max="9" step="1" value="5">
        <input type="range" inline title="Bottom" name="paddingBottom" min="0" max="9" step="1" value="4">
        <input type="checkbox" title="Show Socials" name="showSocials" checked>
        <input type="range" inline title="Social Items" name="socialItems" min="0" max="6" step="1" value="3" condition="showSocials">
        <input type="checkbox" title="Show Legal Line" name="showLegal" checked>
        <input type="color" title="Background Color" name="bgColor" value="#080866">
    <!-- End block parameters -->
    </mbr-parameters>

    <div class="container">
        <div class="row g-4">
            <div class="col-12 col-md-4">
                <h3 class="sk-footer-title mbr-fonts-style" mbr-theme-style="display-5" data-app-selector=".sk-footer-title">Brand</h3>
                <p class="mbr-text mbr-fonts-style" mbr-theme-style="display-7" data-app-selector=".mbr-text">A short line describing who you are and what you do.</p>
            </div>
            <div class="col-6 col-md-4">
                <h4 class="mbr-fonts-style text-white" mbr-theme-style="display-7">Explore</h4>
                <ul class="list-unstyled mbr-fonts-style" mbr-theme-style="display-7" mbr-list>
                    <li mbr-text><a href="#">About</a></li>
                    <li mbr-text><a href="#">Programme</a></li>
                    <li mbr-text><a href="#">Tickets</a></li>
                </ul>
            </div>
            <div class="col-6 col-md-4">
                <h4 class="mbr-fonts-style text-white" mbr-theme-style="display-7">Follow</h4>
                <div mbr-if="showSocials" class="d-flex flex-wrap gap-3 mbr-fonts-style" mbr-theme-style="display-7" mbr-list mbr-list-grow="socialItems">
                    <a href="#">Instagram</a><a href="#">YouTube</a><a href="#">Discord</a>
                </div>
            </div>
        </div>
        <p class="sk-legal mt-5 mb-0 mbr-fonts-style" mbr-theme-style="display-4" mbr-if="showLegal">© 2027 Your Company. All rights reserved.</p>
    </div>
</section>
